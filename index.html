<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário de Eventos Comerciais</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Cabeçalho Principal -->
  <header class="app-header">
    <div class="brand-section">
      <span class="brand-icon">📅</span>
      <div>
        <h1 class="brand-title">Calendário de Eventos</h1>
        <p class="brand-subtitle">Visualização de feiras comerciais e industriais</p>
      </div>
    </div>

    <!-- Navegação de Períodos -->
    <div class="controls-section">
      <div class="nav-controls">
        <button id="btn-prev-period" class="btn btn-icon" title="Período Anterior">◀</button>
        <span id="current-period-title" class="current-period-title">Maio de 2027</span>
        <button id="btn-next-period" class="btn btn-icon" title="Próximo Período">▶</button>
      </div>
      <button id="btn-today" class="btn btn-outline">Hoje</button>
    </div>

    <!-- Seletor de Visões (1 Mês, 3 Meses, 6 Meses, 1 Ano) -->
    <div class="view-selector-group" role="group" aria-label="Modo de Visualização">
      <button class="view-btn active" data-view="1m">1 Mês</button>
      <button class="view-btn" data-view="3m">3 Meses</button>
      <button class="view-btn" data-view="6m">6 Meses</button>
      <button class="view-btn" data-view="1y">1 Ano</button>
    </div>
  </header>

  <!-- Container do Calendário -->
  <main class="calendar-wrapper">
    <div id="calendar-container">
      <!-- O calendário será renderizado dinamicamente aqui via JavaScript -->
    </div>
  </main>

  <!-- MODAL: Detalhes do Evento -->
  <div id="event-detail-modal" class="modal-backdrop">
    <div class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title">Detalhes da Feira / Evento</h3>
        <button class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Preenchido dinamicamente via modal.js -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline modal-close-btn">Fechar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Lista de Eventos do Dia (+N mais) -->
  <div id="day-events-modal" class="modal-backdrop">
    <div class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title">Eventos do Dia</h3>
        <button class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Preenchido dinamicamente via modal.js -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline modal-close-btn">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Scripts da Aplicação -->
  <script src="js/colors.js"></script>
  <script src="js/data.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
